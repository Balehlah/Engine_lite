name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
            gradle: ./gradlew
            seed: 1201
          - name: Windows
            runner: windows-2025
            gradle: .\gradlew.bat
            seed: 1202

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          architecture: x64
          java-version: |
            25
            21

      - name: Validate Wrapper and set up Gradle cache
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Record build environment
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.image=${{ matrix.runner }}"
          echo "revision=${{ github.sha }}"
          java -version
          ${{ matrix.gradle }} --version

      - name: Clean test on Java 21
        timeout-minutes: 15
        run: ${{ matrix.gradle }} --no-daemon --stacktrace clean test -PtestRandomSeed=${{ matrix.seed }}

      - name: Demonstrate Gradle build-cache reuse
        if: matrix.name == 'Ubuntu'
        timeout-minutes: 10
        run: ${{ matrix.gradle }} --no-daemon --info clean test -PtestRandomSeed=${{ matrix.seed }}

      - name: Java 25 compatibility smoke
        timeout-minutes: 10
        run: ${{ matrix.gradle }} --no-daemon --stacktrace java25CompatibilityTest -PtestRandomSeed=${{ matrix.seed }}

      - name: Build and verify packaged distribution
        timeout-minutes: 10
        run: >-
          ${{ matrix.gradle }} --no-daemon --stacktrace
          buildSpikeDistribution verifyDistribution recordSpikeDistributionHash

      - name: Provision pinned Mesa llvmpipe for Windows JDKs
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          & .\.github\scripts\provision-mesa-windows.ps1 `
            -JavaHomes @($env:JAVA_HOME, $env:JAVA_HOME_25_X64) `
            -EnvironmentFile $env:GITHUB_ENV

      - name: Prove Mesa checksum rejection
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $reportDirectory = 'build\reports\distribution'
          New-Item -ItemType Directory -Force -Path $reportDirectory | Out-Null
          $report = Join-Path $reportDirectory 'mesa-checksum-negative.log'
          $wrongHash = [string]::new('0', 64)
          & pwsh -NoProfile -File .\.github\scripts\provision-mesa-windows.ps1 `
            -ArchivePath $env:ENGINE_LITE_MESA_ARCHIVE `
            -ExpectedArchiveSha256 $wrongHash `
            -VerifyArchiveOnly *>&1 | Tee-Object -FilePath $report
          if ($LASTEXITCODE -eq 0) {
            throw 'Mesa provisioning accepted an intentionally incorrect checksum.'
          }
          Add-Content -LiteralPath $report -Value 'mesa.checksum.negative=PASS'

      - name: Smoke packaged ZIP on Java 21
        timeout-minutes: 5
        env:
          ENGINE_LITE_REQUIRE_LLVMPIPE: "${{ matrix.name == 'Windows' }}"
          GALLIUM_DRIVER: "${{ matrix.name == 'Windows' && 'llvmpipe' || '' }}"
          LIBGL_ALWAYS_SOFTWARE: "${{ matrix.name == 'Windows' && '1' || '' }}"
        run: ${{ matrix.gradle }} --no-daemon --stacktrace smokeSpikeDistribution -PspikeSmokeVariant=java21

      - name: Smoke packaged ZIP on Java 25
        timeout-minutes: 5
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
          ENGINE_LITE_REQUIRE_LLVMPIPE: "${{ matrix.name == 'Windows' }}"
          GALLIUM_DRIVER: "${{ matrix.name == 'Windows' && 'llvmpipe' || '' }}"
          LIBGL_ALWAYS_SOFTWARE: "${{ matrix.name == 'Windows' && '1' || '' }}"
        run: ${{ matrix.gradle }} --no-daemon --stacktrace smokeSpikeDistribution -PspikeSmokeVariant=java25

      - name: Verify canonical ZIP remained unchanged
        timeout-minutes: 5
        run: ${{ matrix.gradle }} --no-daemon --stacktrace verifySpikeDistributionHash

      - name: Upload JUnit and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            **/build/test-results/java25CompatibilityTest/**
            **/build/reports/tests/java25CompatibilityTest/**
            build/reports/tests/aggregate/**
            build/reports/licenses/**
            build/reports/jars/**
            **/build/reports/api/**

      - name: Upload packaged spike and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-distribution-and-evidence-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/build/distributions/*.zip
            desktop/build/reports/spike/**
            build/reports/distribution/**
