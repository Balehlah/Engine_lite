# Engine Lite local runtime configuration.
# Precedence: built-in defaults < this file < CLI (--set=field=value / --overlay).
runtime.updates-per-second=60.0
runtime.maximum-frame-time-ms=250
runtime.maximum-catch-up-steps=5
graphics.virtual-width=320
graphics.virtual-height=180
graphics.window-width=640
graphics.window-height=360
graphics.vsync=true
graphics.foreground-fps=60
graphics.idle-fps=60
debug.overlay-enabled=false
logging.level=INFO
metrics.sample-window-ms=1000
